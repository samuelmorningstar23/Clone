name: Deploy Hollowline to GitHub Pages

# Publishes the hollowline/ homepage to GitHub Pages.
# Enable once in the repo: Settings ▸ Pages ▸ Build and deployment ▸ Source = "GitHub Actions".

on:
  push:
    branches: ["claude/almostgods-access-f2xniu"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload the Hollowline site
        uses: actions/upload-pages-artifact@v3
        with:
          path: hollowline

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
